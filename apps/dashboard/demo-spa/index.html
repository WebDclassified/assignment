<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift — a single-page demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101216;
        --surface: #171b21;
        --line: #262c36;
        --ink: #e9ebf1;
        --muted: #9aa1b0;
        --accent: #7c74ff;
        --max: 760px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; }
      header, main, footer { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
      header { display: flex; align-items: center; justify-content: space-between; padding-top: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
      .brand { font-weight: 700; font-size: 18px; }
      .brand span { color: var(--accent); }
      nav { display: flex; gap: 6px; }
      nav button { background: transparent; border: 1px solid transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
      nav button:hover { color: var(--ink); }
      nav button[aria-current="page"] { color: var(--ink); background: var(--surface); border-color: var(--line); }
      main { padding-top: 40px; padding-bottom: 56px; min-height: 60vh; }
      main h1 { font-size: 30px; margin: 0 0 12px; letter-spacing: -0.01em; }
      main p { color: var(--muted); margin: 0 0 16px; max-width: 56ch; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 28px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; cursor: pointer; }
      .card:hover { border-color: var(--accent); }
      .card h2 { font-size: 16px; margin: 0 0 6px; }
      .card p { font-size: 13px; margin: 0; }
      .price { font-size: 28px; font-weight: 700; margin: 20px 0 4px; }
      footer { border-top: 1px solid var(--line); padding-top: 16px; padding-bottom: 32px; font-size: 13px; color: var(--muted); }
      footer nav { gap: 12px; margin-top: 8px; }
      footer a { color: var(--muted); text-decoration: none; }
    </style>
    <script
      type="module"
      src="/demo/tracker-entry.js"
      data-api-base=""
      data-site-id="demo-spa"
    ></script>
  </head>
  <body>
    <header>
      <div class="brand">Drift<span>.</span></div>
      <nav aria-label="Demo sections">
        <button type="button" data-view="overview" aria-current="page">Overview</button>
        <button type="button" data-view="pricing">Pricing</button>
        <button type="button" data-view="faq">FAQ</button>
      </nav>
    </header>

    <main id="view" aria-live="polite"></main>

    <footer>
      <p>Drift is a fictional single-page demo. Navigation uses the History API without full page loads.</p>
      <nav aria-label="More demos">
        <a href="/demo/">Store demo</a>
        <a href="/demo-blog/">Blog demo</a>
      </nav>
    </footer>

    <script>
      const views = {
        overview: {
          path: "/demo-spa/",
          title: "Analytics without the page loads",
          html: "<p>Drift never reloads. Each section below swaps content with the History API, and the Pathlens tracker records one page view per section.</p><div class=\"cards\"><div class=\"card\" data-card=\"events\"><h2>Events</h2><p>Clicks and views stream in as they happen.</p></div><div class=\"card\" data-card=\"sessions\"><h2>Sessions</h2><p>Anonymous visits grouped into journeys.</p></div><div class=\"card\" data-card=\"heatmaps\"><h2>Heatmaps</h2><p>See exactly where visitors clicked.</p></div></div>",
        },
        pricing: {
          path: "/demo-spa/pricing",
          title: "Simple pricing",
          html: "<p class=\"price\">Free for demos</p><p>No seats, no tiers, no card — this page exists so route changes have somewhere to go. Click a card below, then check the heatmap.</p><div class=\"cards\"><div class=\"card\" data-card=\"starter\"><h2>Starter</h2><p>For side projects and weekends.</p></div><div class=\"card\" data-card=\"team\"><h2>Team</h2><p>For everyone shipping together.</p></div></div>",
        },
        faq: {
          path: "/demo-spa/faq",
          title: "Questions, answered",
          html: "<p><strong>Does the back button work?</strong><br />Yes — popstate counts as navigation too.</p><p><strong>Does refreshing break the session?</strong><br />No. Reloads keep the same session until 30 quiet minutes pass.</p><div class=\"cards\"><div class=\"card\" data-card=\"docs\"><h2>Read the docs</h2><p>Just kidding — click around instead.</p></div></div>",
        },
      };

      const view = document.getElementById("view");
      const buttons = [...document.querySelectorAll("nav button[data-view]")];

      function render(name, push) {
        const selected = views[name] || views.overview;
        if (push) history.pushState({ view: name }, "", selected.path);
        document.title = `${selected.title} — Drift`;
        view.innerHTML = `<h1>${selected.title}</h1>${selected.html}`;
        for (const button of buttons) {
          if (button.dataset.view === name) {
            button.setAttribute("aria-current", "page");
          } else {
            button.removeAttribute("aria-current");
          }
        }
      }

      for (const button of buttons) {
        button.addEventListener("click", () => render(button.dataset.view, true));
      }
      window.addEventListener("popstate", (event) => {
        render((event.state && event.state.view) || "overview", false);
      });

      const initial = location.pathname.startsWith("/demo-spa/pricing")
        ? "pricing"
        : location.pathname.startsWith("/demo-spa/faq")
          ? "faq"
          : "overview";
      render(initial, false);

      (function waitForTracker(attempts) {
        if (window.pathlens && window.pathlens.trackSpaNavigation) {
          window.pathlens.trackSpaNavigation();
        } else if (attempts > 0) {
          setTimeout(() => waitForTracker(attempts - 1), 100);
        }
      })(50);
    </script>
  </body>
</html>
